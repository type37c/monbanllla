[package]
name = "monban-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "monban — エージェントとの契約を機械が執行する門。人間向けの口(CLI)"
publish = false

[[bin]]
name = "monban"
path = "src/main.rs"

[dependencies]
monban-core = { path = "../monban-core" }
banto-kernel.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
